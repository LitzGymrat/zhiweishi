services:
  zhiweishi-public:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhiweishi-public
    restart: unless-stopped
    env_file:
      - .env
    environment:
      app_mode: ${PUBLIC_APP_MODE:-poc1_readonly}
      PORT: 8506
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "8506:8506"
    volumes:
      - ./data:/app/data